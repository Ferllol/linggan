<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="52%" stop-color="#7b6bff"/>
      <stop offset="100%" stop-color="#ff2fd6"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#7b6bff" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#7b6bff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
  </defs>

  <!-- 深色底：与站点 --bg 一致，圆角贴合浏览器标签页 -->
  <rect width="64" height="64" rx="14" fill="#0a0a0f"/>
  <rect width="64" height="64" rx="14" fill="url(#halo)"/>

  <!-- 窗棂：四格木格，呼应「棂」的本义 -->
  <g stroke="url(#g)" stroke-width="3.1" stroke-linecap="round" fill="none" opacity=".9" filter="url(#soft)">
    <rect x="15" y="15" width="34" height="34" rx="4"/>
    <path d="M32 15v34M15 32h34"/>
  </g>
  <g stroke="url(#g)" stroke-width="2.6" stroke-linecap="round" fill="none">
    <rect x="15" y="15" width="34" height="34" rx="4"/>
    <path d="M32 15v34M15 32h34"/>
  </g>

  <!-- 中心光点：呼应「感」 -->
  <circle cx="32" cy="32" r="4.6" fill="#0a0a0f"/>
  <circle cx="32" cy="32" r="3.2" fill="url(#g)"/>
</svg>
